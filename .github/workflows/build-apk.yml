name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Unit tests for the alert rules. They never block the APK: if one fails you still get the app, plus a report.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk weather.apk
      - uses: actions/upload-artifact@v4
        with:
          name: weather-apk
          path: weather.apk
      # Always-the-same download link for your phone: Releases -> "Latest build" -> weather.apk
      - name: Publish to the "latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest weather.apk --title "Latest build" --notes "Build #${{ github.run_number }} (${{ github.sha }})" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
